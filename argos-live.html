/* ---- scoring helpers (points computed live from guesses) ---- */
function priceAt(room,pos){ const it=POOL[room.order[pos]]; return it?it.gbp:0; }
function guessOf(p,pos){ return p&&p.guesses&&p.guesses[pos]!=null ? p.guesses[pos] : null; }
function scorePos(room,pos){
  const price=priceAt(room,pos); const ps=playerList(room);
  let best=Infinity;
  ps.forEach(p=>{ const g=guessOf(p,pos); if(g!=null){ const d=Math.abs(g-price); if(d<best)best=d; } });
  const res={};
  ps.forEach(p=>{ const g=guessOf(p,pos); let pt=0,win=false,spot=false; if(g!=null && best<Infinity){ const d=Math.abs(g-price); if(d===best){ win=true; spot=(d===0); pt=spot?2:1; } } res[p.id]={guess:g,pts:pt,win,spot}; });
  return {price,res};
}
function roundsScored(room){ if(!room) return 0; if(room.phase==="final") return ROUNDS; if(room.phase==="reveal") return room.round+1; if(room.phase==="guessing") return room.round; return 0; }
function totalFor(room,id){ const n=Math.min(roundsScored(room)*PER_ROUND,(room.order||[]).length); let t=0; for(let pos=0;pos<n;pos++){ const r=scorePos(room,pos).res[id]; if(r)t+=r.pts; } return t; }
function roundPtsFor(room,id,rd){ let t=0; const base=rd*PER_ROUND; for(let pos=base;pos<Math.min(base+PER_ROUND,(room.order||[]).length);pos++){ const x=scorePos(room,pos).res[id]; if(x)t+=x.pts; } return t; }
function allSubmitted(room){ const ps=playerList(room); return ps.length>0 && ps.every(p=>(p.submittedRound==null?-1:p.submittedRound)>=room.round); }

  roomRef(code).update({phase:"guessing",round:0,players,deadline:null});
}
function hostReveal(code,room){ if(!room||room.phase!=="guessing") return; roomRef(code).update({phase:"reveal"}); }
function hostNext(code,room){ if(!room||room.phase!=="reveal") return; const r=room.round+1; if(r>=ROUNDS){ roomRef(code).update({phase:"final"}); return; } roomRef(code).update({round:r,phase:"guessing"}); }

  const [name,setName]=useState(""); const [code,setCode]=useState(prefillCode||"");
  const invited=!!prefillCode;
  const steps=[
    "Everyone joins on their own phone with the room code or the shared link.",
    "Flip through the products and put your price on each — 3 rounds of 6 items.",
    "Closest guess scores 1 point. Spot-on scores 2. A tie? Everyone tied scores.",
    "After every round you'll all see everyone's guesses and the real prices.",

  ];
  return (
    <div className="min-h-screen bg-gradient-to-b from-[#CE3320] to-[#AE2817] text-white flex flex-col items-center px-6 py-8">
      <Trevor size={116} cls="mb-2"/>
      <div className="font-hand text-[#E7C96B] text-xl">Christmas Day</div>
      <div className="font-display font-extrabold text-4xl mb-2 text-center">The Argos Game</div>
      <div className="text-white/80 mb-6 text-center max-w-sm">Guess the Argos price. Everyone plays on their own phone.</div>
      <div className="w-full max-w-sm bg-white/10 rounded-2xl p-5 ring-1 ring-white/15">
        <label className="block text-sm font-bold text-white mb-1">Your name</label>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Jenna" maxLength={14} className="w-full rounded-xl px-4 py-3 bg-white text-[#1A1410] font-semibold outline-none ring-2 ring-transparent focus:ring-white"/>
        {invited ? (
          <div className="mt-4">
            <div className="text-white/70 text-sm mb-2">You're joining room <b className="text-[#C9A646] font-display tracking-widest">{code}</b></div>
            <Btn tone="gold" className="w-full py-3.5 text-lg" disabled={name.trim().length<1} onClick={()=>onJoin(code,name)}>Join game →</Btn>
          </div>
        ) : (
          <div className="mt-4 space-y-4">
            <Btn tone="pine" className="w-full py-3.5 text-lg" disabled={name.trim().length<1} onClick={()=>onStart(name)}>Start a new game</Btn>
            <div className="flex items-center gap-3 text-white/40 text-xs"><div className="flex-1 h-px bg-white/15"/>or join one<div className="flex-1 h-px bg-white/15"/></div>
            <div>
              <label className="block text-sm font-bold text-[#E7C96B] mb-1">Room code</label>
              <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,"").slice(0,4))} inputMode="numeric" placeholder="0000" className="w-full rounded-xl px-4 py-3 bg-[#FFF6DD] text-[#8a6d12] border-2 border-[#C9A646] font-display font-extrabold text-2xl tracking-[0.4em] text-center outline-none placeholder:text-[#d8c88a]"/>
              <Btn tone="gold" className="w-full py-3 mt-2" disabled={name.trim().length<1||code.length!==4} onClick={()=>onJoin(code,name)}>Join game →</Btn>
            </div>
          </div>
        )}
      </div>
      <div className="w-full max-w-sm mt-5 bg-white/5 rounded-2xl p-5 ring-1 ring-white/10">
        <div className="font-display font-extrabold text-lg text-[#E7C96B] mb-3">How to play</div>
        <div className="space-y-2.5">
          {steps.map((s,i)=>(<div key={i} className="flex items-start gap-3">
            <div className="w-6 h-6 rounded-full bg-[#C9A646] text-[#2a1e05] font-bold text-sm grid place-items-center shrink-0 mt-0.5">{i+1}</div>
            <div className="text-sm text-white/85 leading-snug">{s}</div>
          </div>))}
        </div>
      </div>
      <div className="text-white/50 text-xs mt-5 max-w-sm text-center">Whoever starts also plays and runs the rounds. Share the link from the lobby so everyone can jump in.</div>
    </div>
  );
}
function roastRound(room,rd){
  const base=rd*PER_ROUND; const positions=[]; for(let i=0;i<PER_ROUND;i++){const p=base+i; if(p<room.order.length)positions.push(p);}
  const players=playerList(room);
  let best=null, worst=null; const spend={};
  players.forEach(p=>spend[p.id]={name:p.name,total:0,rpts:roundPtsFor(room,p.id,rd)});
  positions.forEach(pos=>{ const price=priceAt(pos?room:room,pos); const it=POOL[room.order[pos]]||{};
    players.forEach(p=>{ const g=guessOf(p,pos); if(g==null)return; const err=Math.abs(g-price); const pct=err/(price||1);
      spend[p.id].total+=g;
      const rec={name:p.name,g,price,err,pct,item:it.name||"",code:it.code,v:it.v};
      if(!best||pct<best.pct) best=rec;
      if(!worst||pct>worst.pct) worst=rec;
    });
  });
  const ids=players.map(p=>p.id);
  const bs=ids.slice().sort((a,b)=>spend[b].total-spend[a].total)[0];
  const rw=ids.slice().sort((a,b)=>spend[b].rpts-spend[a].rpts)[0];
  return {best,worst,bigSpender:bs?spend[bs]:null,roundWinner:rw?spend[rw]:null};
}
function RoundRoast({room,rd,isHost,onSheet,onNext,last}){
  const r=roastRound(room,rd);
  const short=s=>s&&s.length>24?s.slice(0,24)+"…":s;
  const quip = r.worst ? `${r.worst.name} looked at a ${short(r.worst.item)} and said ${gbp(r.worst.g)}. It was ${gbp(r.worst.price)}. Trevor needs a lie down.` : "Trevor is quietly impressed.";
  const Big=({rec,emoji,label,good})=> rec? (
    <div className={"rounded-2xl p-3 ring-1 "+(good?"bg-[#174A2B]/45 ring-[#9BE5A0]/40":"bg-black/25 ring-white/15")}>
      <div className="flex items-center gap-3">
        <div className="w-24 h-24 bg-white rounded-xl p-1.5 shrink-0 flex items-center justify-center">{rec.code?<ArgImg code={rec.code} v={rec.v} size={300} className="max-w-full max-h-full object-contain"/>:<span className="text-3xl">🏷️</span>}</div>
        <div className="flex-1 min-w-0">
          <div className={"text-[11px] uppercase tracking-widest font-bold "+(good?"text-[#9BE5A0]":"text-[#E7C96B]")}>{emoji} {label}</div>
          <div className="font-display font-extrabold text-2xl text-white leading-tight">{rec.name}</div>
          <div className="text-white/75 text-sm leading-tight truncate">{rec.item}</div>
          <div className="text-sm mt-1"><span className="text-white/60">guessed</span> <b className="text-white">{gbp(rec.g)}</b> · <span className="text-white/60">it was</span> <b className="text-[#C9A646]">{gbp(rec.price)}</b></div>
        </div>
      </div>
    </div>
  ):null;
  return (
    <div className="min-h-screen bg-gradient-to-b from-[#CE3320] to-[#AE2817] text-white flex flex-col px-5 py-6 overflow-auto no-scrollbar">
      <div className="text-center mb-4">
        <Trevor size={92} cls="mx-auto mb-1"/>
        <div className="font-hand text-[#E7C96B] text-xl">Trevor's verdict</div>
        <div className="font-display font-extrabold text-3xl">Round {rd+1} — the damage</div>
      </div>
      <div className="space-y-3 max-w-md mx-auto w-full">
        <Big rec={r.best} emoji="🎯" label="Guess of the round" good/>
        <Big rec={r.worst} emoji="🌋" label="Wildest miss"/>
        <div className="grid grid-cols-2 gap-3">
          {r.bigSpender&&<div className="bg-white/10 rounded-2xl p-3 ring-1 ring-white/10"><div className="text-xl">🤑</div><div className="text-[11px] uppercase tracking-wide font-bold text-white/60">Biggest spender</div><div className="font-display font-extrabold text-lg text-[#C9A646] leading-tight">{r.bigSpender.name}</div><div className="text-[11px] text-white/60">{gbp(r.bigSpender.total)} of guesses</div></div>}
          {r.roundWinner&&<div className="bg-white/10 rounded-2xl p-3 ring-1 ring-white/10"><div className="text-xl">👑</div><div className="text-[11px] uppercase tracking-wide font-bold text-white/60">Round winner</div><div className="font-display font-extrabold text-lg text-[#9BE5A0] leading-tight">{r.roundWinner.name}</div><div className="text-[11px] text-white/60">+{r.roundWinner.rpts} points</div></div>}
        </div>
        <div className="bg-black/20 rounded-2xl p-3 text-center font-hand text-lg text-[#E7C96B]">"{quip}"</div>
      </div>
      <div className="mt-6 max-w-md mx-auto w-full flex flex-col gap-2">
        <Btn tone="gold" className="w-full py-3" onClick={onSheet}>📋 See everyone's scoresheet</Btn>
        {isHost && <Btn tone="pine" className="w-full py-3" onClick={onNext}>{last?"Skip to final results 🏆":"Next round →"}</Btn>}
      </div>
    </div>
  );
}
function GuessDeck({code,room}){
  const base=room.round*PER_ROUND;
  const positions=[]; for(let i=0;i<PER_ROUND;i++){ const pos=base+i; if(pos<room.order.length) positions.push(pos); }
  const [vals,setVals]=useState(()=>positions.map(()=>""));
  const [cur,setCur]=useState(0);
  const pos=positions[cur]; const item=POOL[room.order[pos]]||{};
  const setVal=v=>setVals(a=>{const b=a.slice();b[cur]=v;return b;});
  const filled=vals.filter(v=>parseFloat(v)>0).length;
  const allIn=filled===positions.length;
  const submit=()=>{ const up={submittedRound:room.round}; positions.forEach((p,i)=>{ up["guesses/"+p]=parseFloat(vals[i])||0; }); roomRef(code).child("players/"+myId).update(up); };
  return (
    <div className="min-h-screen bg-[#FBF6EC] text-[#1A1410] flex flex-col">
      <div className="bg-[#C8102E] text-white px-5 py-3 flex items-center justify-between">
        <div className="font-bold">Round {room.round+1} of {ROUNDS}</div>
        <div className="text-sm font-semibold tnum">Item {cur+1} / {positions.length}</div>
      </div>
      <div className="flex justify-center gap-2 py-2.5 bg-[#F3EAD6]">
        {positions.map((p,i)=><button key={i} onClick={()=>setCur(i)} className={"w-3 h-3 rounded-full transition "+(i===cur?"bg-[#C8102E] scale-125":parseFloat(vals[i])>0?"bg-[#174A2B]":"bg-[#d9c9a6]")}/>)}
      </div>
      <div className="flex-1 flex flex-col items-center px-6 pt-4 overflow-auto no-scrollbar">
        <Photo idx={room.order[pos]} reveal={false} cls="h-60"/>
        <div className="font-display font-bold text-lg text-center mt-3">{item.name}</div>
        {item.desc && <div className="text-[#8a7a5f] text-xs text-center mb-2">{item.desc}</div>}
        <label className="text-[#8a7a5f] text-xs font-bold mb-1">Your price guess</label>
        <div className="font-display font-extrabold text-4xl text-[#C8102E] mb-3 tnum">£{vals[cur]||"0"}</div>
        <Keypad val={vals[cur]} setVal={setVal}/>
        <div className="text-[#8a7a5f] text-xs mt-3">Tap <b>.</b> for pennies, e.g. 24.99</div>
      </div>
      <div className="p-4 flex gap-3 items-stretch">
        <button onClick={()=>setCur(c=>Math.max(0,c-1))} disabled={cur===0} className="rounded-xl px-5 bg-black/5 text-[#1A1410] font-bold text-xl disabled:opacity-30">←</button>
        {cur<positions.length-1
          ? <Btn tone="red" className="flex-1 py-4 text-lg" disabled={!(parseFloat(vals[cur])>0)} onClick={()=>setCur(c=>c+1)}>Next item →</Btn>
          : <Btn tone="pine" className="flex-1 py-4 text-lg" disabled={!allIn} onClick={submit}>🔒 Submit all {positions.length}</Btn>}
      </div>
      {cur===positions.length-1 && !allIn && <div className="text-center text-[#8a7a5f] text-xs pb-3 -mt-1">Put a price on every item to submit — {filled}/{positions.length} done. Tap the dots to go back.</div>}
    </div>
  );
}
function GameScreen({code,room,isHost}){
  const [showSheet,setShowSheet]=useState(false);
  useEffect(()=>{ setShowSheet(false); },[room&&room.phase,room&&room.round]);
  if(!room) return <Splash msg="Loading game…"/>;
  const me=room.players&&room.players[myId];
  const players=playerList(room);
  const joinUrl=location.origin+location.pathname+"?code="+code;
  const tvUrl=joinUrl+"&tv=1";

  if(room.phase==="lobby"){
    const share=async()=>{ try{ if(navigator.share){ await navigator.share({title:"The Argos Game",text:"Join my Argos Game — code "+code,url:joinUrl}); } else { await navigator.clipboard.writeText(joinUrl); alert("Invite link copied — paste it into your group chat."); } }catch(e){} };
    const shareTV=async()=>{ try{ if(navigator.share){ await navigator.share({title:"Argos Game scoreboard",text:"Open the Argos Game scoreboard on the TV",url:tvUrl}); } else { await navigator.clipboard.writeText(tvUrl); alert("TV scoreboard link copied — open it in a browser on your TV."); } }catch(e){} };
    return (
      <div className="min-h-screen bg-gradient-to-b from-[#CE3320] to-[#AE2817] text-white flex flex-col items-center px-6 py-8 overflow-auto no-scrollbar">
        <div className="font-hand text-[#E7C96B] text-lg">Christmas Day</div>
        <div className="font-display font-extrabold text-3xl mb-4">The Argos Game</div>
        <div className="text-white/70 text-xs uppercase tracking-widest font-bold mb-1">Room code</div>
        <div className="font-display font-extrabold text-6xl tracking-[0.2em] text-[#C9A646] tnum mb-4">{code}</div>
        <QR text={joinUrl} size={190}/>
        <Btn tone="gold" className="mt-4 w-full max-w-xs py-3" onClick={share}>🔗 Share invite link</Btn>
        <Btn tone="ghost" className="mt-2 w-full max-w-xs py-3" onClick={shareTV}>📺 Show scoreboard on a TV</Btn>
        <div className="text-white/50 text-xs mt-1">or just tell people the code above</div>
        <div className="w-full max-w-sm mt-6">
          <div className="text-xs uppercase tracking-widest font-bold text-white/60 mb-2">In the game ({players.length})</div>
          <div className="flex flex-wrap gap-2">{players.map(p=>(<div key={p.id} className="flex items-center gap-2 bg-white/10 rounded-full pl-1 pr-3 py-1"><div className="w-6 h-6 rounded-full grid place-items-center text-xs font-bold" style={{background:p.color}}>{(p.name||"?")[0].toUpperCase()}</div><span className="text-sm font-semibold">{p.name}{p.id===myId?" (you)":""}</span></div>))}</div>
        </div>
        <div className="w-full max-w-xs mt-8">
          {isHost
            ? <Btn tone="pine" className="w-full py-4 text-lg" disabled={players.length<1} onClick={()=>hostStart(code,room)}>Start game ▶</Btn>
            : <div className="text-center text-white/75 bg-white/10 rounded-xl py-3">Waiting for the host to start…</div>}
        </div>
        <div className="text-white/45 text-xs mt-4 max-w-xs text-center">3 rounds · 6 items each · closest guess scores</div>
      </div>
    );
  }

  if(room.phase==="guessing"){
    const submitted=me&&(me.submittedRound==null?-1:me.submittedRound)>=room.round;
    if(!submitted) return <GuessDeck code={code} room={room}/>;
    const nSub=players.filter(p=>(p.submittedRound==null?-1:p.submittedRound)>=room.round).length;
    return (<Center bg="pine">
      <div className="text-5xl mb-3">✅</div>
      <div className="font-display font-extrabold text-2xl">You're in!</div>
      <div className="text-white/70 mb-4">Round {room.round+1} locked. Waiting for everyone else…</div>
      <div className="font-display font-extrabold text-5xl text-[#E7C96B] tnum">{nSub}<span className="text-white/40">/{players.length}</span></div>
      <div className="text-white/60 text-sm uppercase tracking-widest font-bold mt-1">submitted</div>
      {isHost && nSub<players.length && <div className="mt-6"><Btn tone="gold" onClick={()=>hostReveal(code,room)}>Reveal now (skip the slowpokes)</Btn></div>}
    </Center>);
  }

  if(room.phase==="reveal"){
    const base=room.round*PER_ROUND; const idxs=[]; for(let i=0;i<PER_ROUND;i++){const p=base+i; if(p<room.order.length)idxs.push(p);}
    const last=room.round+1>=ROUNDS;
    const myRp=me?roundPtsFor(room,myId,room.round):0;
    if(!showSheet) return <RoundRoast room={room} rd={room.round} isHost={isHost} onSheet={()=>setShowSheet(true)} onNext={()=>hostNext(code,room)} last={last}/>;
    return (<div className="min-h-screen bg-gradient-to-b from-[#CE3320] to-[#AE2817] text-white flex flex-col items-center px-4 py-6 overflow-auto no-scrollbar">
      <button onClick={()=>setShowSheet(false)} className="self-start text-white/60 text-sm mb-1">← back to the roast</button>
      <div className="font-display font-extrabold text-2xl text-[#C9A646] mb-1 text-center">Round {room.round+1} scoresheet</div>
      {me && <div className="text-[#9BE5A0] font-bold mb-3">You scored +{myRp} this round</div>}
      <div className="w-full max-w-3xl"><ScoreSheet room={room} idxs={idxs} title/></div>
      <div className="w-full max-w-sm mt-6"><div className="text-xs uppercase tracking-widest font-bold text-white/60 mb-2">Standings</div><Leaderboard room={room} compact/></div>
      {isHost
        ? <Btn tone="gold" className="mt-6 px-6 py-3" onClick={()=>hostNext(code,room)}>{last?"See final results 🏆":"Next round →"}</Btn>
        : <div className="text-white/50 text-sm mt-6">Waiting for the host to continue…</div>}
    </div>);
  }

  if(room.phase==="final"){
    const onAgain=()=>{ const players={}; Object.entries(room.players||{}).forEach(([id,p])=>players[id]={name:p.name,color:p.color,guesses:{},submittedRound:-1}); roomRef(code).update({phase:"lobby",round:0,order:shuffledOrder().slice(0,TOTAL_N),players}); };
    return <div className="min-h-screen bg-gradient-to-b from-[#CE3320] to-[#AE2817] text-white flex flex-col"><Final room={room} isHost={isHost} onAgain={onAgain}/></div>;
  }
  return <Splash msg="One moment…"/>;
}
function ScoreSheet({room,idxs,title}){
  const positions = idxs || (room.order||[]).map((_,i)=>i);
  const players=playerList(room).map(p=>({...p,_t:totalFor(room,p.id)})).sort((a,b)=>b._t-a._t);
  if(!positions.length||!players.length) return <div className="text-white/60 text-sm text-center">Nothing to show yet.</div>;
  return (
    <div className="bg-[#FBF6EC] text-[#1A1410] rounded-2xl p-3 sm:p-5 overflow-x-auto no-scrollbar shadow-xl ring-1 ring-black/10">
      {title && <div className="text-center mb-4"><div className="font-display font-extrabold text-2xl sm:text-3xl text-[#1A1410]">Christmas Day Argos Game</div><div className="font-hand text-[#8a7a5f] text-lg">Trevor reads out the prices…</div></div>}
      <table className="text-sm" style={{borderCollapse:"collapse",width:"100%",minWidth:230+players.length*78}}>
        <thead><tr className="border-b-2 border-[#E6D9BF]">
          <th className="text-left p-2 text-[#8a7a5f] font-bold">Item</th>
          <th className="p-2 text-[#C8102E] font-bold">Price</th>
          {players.map(p=><th key={p.id} className={"p-2 font-bold whitespace-nowrap "+(p.id===myId?"bg-[#F3EAD6]":"")} style={{color:p.color}}>{p.name}{p.id===myId?" (you)":""}</th>)}
        </tr></thead>
        <tbody>
          {positions.map((pos,ri)=>{ const sc=scorePos(room,pos); const it=POOL[room.order[pos]]||{};
            return (<tr key={pos} className="border-b border-[#E6D9BF]">
              <td className="p-2"><div className="flex items-center gap-2.5">
                <div className="relative shrink-0"><div className="w-20 h-20 bg-white rounded-lg ring-1 ring-black/5 flex items-center justify-center p-1">{it.code?<ArgImg code={it.code} v={it.v} size={200} className="max-w-full max-h-full object-contain"/>:<span className="text-xl">🏷️</span>}</div><div className="absolute -top-2 -left-2 w-6 h-6 rounded-full bg-[#C8102E] text-white text-xs font-bold grid place-items-center ring-2 ring-[#FBF6EC]">{ri+1}</div></div>
                <span className="text-sm font-semibold leading-tight" style={{maxWidth:160}}>{it.name}</span></div></td>
              <td className="p-2 text-center font-display font-extrabold text-[#C8102E] tnum whitespace-nowrap">{gbp(sc.price)}</td>
              {players.map(p=>{ const r=sc.res[p.id]||{}; const v=r.guess;
                return <td key={p.id} className={"p-2 text-center tnum whitespace-nowrap "+(p.id===myId?"bg-[#F3EAD6]/60":"")}>{v!=null
                  ? <span className={r.spot?"inline-block px-2 py-0.5 rounded-full bg-[#C9A646] text-[#2a1e05] font-extrabold":r.win?"inline-block px-2 py-0.5 rounded-full bg-[#C8102E] text-white font-bold":"text-[#4a4032]"}>{r.spot?"👑 ":""}{gbp(v)}</span>
                  : <span className="text-[#bbb]">—</span>}</td>;})}
            </tr>);
          })}
          <tr className="border-t-2 border-[#C8102E]">
            <td className="p-2 font-display font-bold">Total points</td><td/>
            {players.map(p=><td key={p.id} className={"p-2 text-center font-display font-extrabold text-lg tnum "+(p.id===myId?"bg-[#F3EAD6]":"")}>{p._t}</td>)}
          </tr>
        </tbody>
      </table>
      <div className="text-[11px] text-[#8a7a5f] mt-3 text-center">Closest guess circled in red · 👑 spot-on (2 pts) · ties both score</div>
    </div>
  );
}
function awardsFrom(room){
  const players=playerList(room); const positions=(room.order||[]).map((_,i)=>i).slice(0,roundsScored(room)*PER_ROUND);
  if(!players.length||!positions.length) return [];
  const st={}; players.forEach(p=>st[p.id]={name:p.name,wins:0,total:0,err:0,wild:-1,wi:null});
  positions.forEach(pos=>{ const sc=scorePos(room,pos); const price=sc.price;
    players.forEach(p=>{ const r=sc.res[p.id]; const v=r?r.guess:null; if(v==null)return; const d=Math.abs(v-price); st[p.id].total+=v; st[p.id].err+=d; const rr=d/(price||1); if(rr>st[p.id].wild){st[p.id].wild=rr;st[p.id].wi={g:v,p:price};} if(r.win)st[p.id].wins++; });
  });
  const ids=players.map(p=>p.id);
  const top=(fn,dir)=>ids.slice().sort((a,b)=>(fn(st[b])-fn(st[a]))*(dir||1))[0];
  const sn=top(s=>s.wins), sp=top(s=>s.total), wd=top(s=>s.wild), cd=top(s=>s.err);
  return [
    {e:"🎯",t:"Spot-On Sniper",n:st[sn].name,d:`closest on ${st[sn].wins} ${st[sn].wins===1?"item":"items"}`},
    {e:"🌋",t:"Wildest Guess",n:st[wd].name,d:st[wd].wi?`guessed ${gbp(st[wd].wi.g)}, it was ${gbp(st[wd].wi.p)}`:""},
    {e:"🤑",t:"Biggest Spender",n:st[sp].name,d:`${gbp(st[sp].total)} of guesses`},
    {e:"🧊",t:"Ice Cold",n:st[cd].name,d:`${gbp(st[cd].err)} off all game`},
  ];
}
function Awards({room}){
  const a=awardsFrom(room); if(!a.length) return null;
  return (<div className="mt-5">
    <div className="text-center font-hand text-2xl text-[#E7C96B] mb-2">And the awards go to…</div>
    <div className="grid grid-cols-2 gap-2">
      {a.map((x,i)=>(<div key={i} className="bg-white/10 rounded-xl p-3 ring-1 ring-white/10 text-left">
        <div className="text-2xl leading-none mb-1">{x.e}</div>
        <div className="font-bold text-xs text-white">{x.t}</div>
        <div className="font-display font-extrabold text-xl text-[#C9A646] leading-tight">{x.n}</div>
        <div className="text-[11px] text-white/60 leading-tight">{x.d}</div>
      </div>))}
    </div>
  </div>);
}
function Final({room,onAgain,isHost}){
  const ps=playerList(room).map(p=>({...p,_t:totalFor(room,p.id)})).sort((a,b)=>b._t-a._t);
  const win=ps[0];
  return (<div className="flex-1 overflow-auto no-scrollbar px-4 py-6">
    <div className="text-center mb-5">
      <div className="text-5xl mb-1 floaty">🏆</div>
      <div className="text-white/60 uppercase tracking-widest text-xs font-bold">Winner</div>
      <div className="font-display font-extrabold text-5xl text-[#C9A646] pop">{win?win.name:"—"}</div>
      {win&&<div className="text-xl mt-1">with {win._t} points</div>}
    </div>
    <div className="max-w-3xl mx-auto"><ScoreSheet room={room} title/></div>
    <div className="max-w-md mx-auto"><Awards room={room}/></div>
    <div className="text-center mt-5">{isHost? <Btn tone="pine" onClick={onAgain}>↺ Play again</Btn> : <div className="text-white/60 text-sm">The host can start a new game.</div>}</div>
  </div>);
}
function PlayerScreen(){ return null; }
function Keypad({val,setVal}){
  const s=String(val||"");
  const push=d=>{
    if(d==="."){ if(s.includes(".")) return; setVal((s||"0")+"."); return; }
    if(s.includes(".") && (s.split(".")[1]||"").length>=2) return;
    const n=(s==="0"?"":s)+d; if(n.replace(".","").length>7) return; setVal(n);
  };
  const K=({children,onClick})=><button onClick={onClick} className="bg-white rounded-xl py-3.5 font-bold text-2xl shadow ring-1 ring-black/5 active:translate-y-[1px]">{children}</button>;
  return (<div className="grid grid-cols-3 gap-2 w-full max-w-[320px]">
    {["1","2","3","4","5","6","7","8","9"].map(k=><K key={k} onClick={()=>push(k)}>{k}</K>)}
    <K onClick={()=>push(".")}>.</K>
    <K onClick={()=>push("0")}>0</K>
    <K onClick={()=>setVal(s.slice(0,-1))}>⌫</K>
  </div>);
}
function Center({children,bg}){ return <div className={"min-h-screen flex flex-col items-center justify-center text-center px-6 text-white "+(bg==="pine"?"bg-gradient-to-b from-[#174A2B] to-[#0e3019]":"bg-gradient-to-b from-[#CE3320] to-[#AE2817]")}>{children}</div>; }
function Splash({msg}){ return <Center><div className="text-4xl mb-3 floaty">🎁</div><div className="text-white/80">{msg}</div></Center>; }

/* ---- setup / error screen when Firebase isn't configured ---- */
function SetupNeeded(){
  return (<div className="min-h-screen bg-[#AE2817] text-white flex items-center justify-center px-6">
    <div className="max-w-md bg-white/10 rounded-2xl p-6 ring-1 ring-white/15">
      <div className="text-3xl mb-2">🔌</div>
      <div className="font-display font-extrabold text-2xl mb-2">Almost there — connect Firebase</div>
      <p className="text-white/80 text-sm mb-3">This is the live multiplayer build. It needs a free Firebase Realtime Database to sync phones with the screen. Paste your project's config into the <code className="bg-black/30 px-1 rounded">ARGOS_FIREBASE_CONFIG</code> block near the top of this file, then reload.</p>
      <p className="text-white/50 text-xs">Status: {FB_ERR==="sdk-missing"?"Firebase SDK didn't load (check your network / the two firebase script tags).":"Config still has PASTE placeholders."}</p>
    </div>
  </div>);
}

/* ---- root: pick role, subscribe to room ---- */
function TVCodeEntry({onCode}){
  const [c,setC]=useState("");
  return (<Center><div className="text-5xl mb-3">📺</div><div className="font-display font-extrabold text-2xl mb-1">TV scoreboard</div><div className="text-white/70 mb-4 text-sm">Enter the room code shown on a player's phone.</div>
    <input value={c} onChange={e=>setC(e.target.value.replace(/\D/g,"").slice(0,4))} inputMode="numeric" placeholder="0000" className="rounded-xl px-4 py-3 bg-[#FFF6DD] text-[#8a6d12] border-2 border-[#C9A646] font-display font-extrabold text-3xl tracking-[0.4em] text-center outline-none w-52"/>
    <div className="mt-4"><Btn tone="gold" disabled={c.length!==4} onClick={()=>onCode(c)}>Show scoreboard</Btn></div>
  </Center>);
}
function TVScreen({code,room}){
  const joinUrl=location.origin+location.pathname+"?code="+code;
  if(!room) return <Center><div className="text-4xl mb-3 floaty">📺</div><div className="text-white/80">Looking for room {code}…</div><div className="text-white/50 text-sm mt-1">Make sure someone has started this game on their phone.</div></Center>;
  const players=playerList(room);
  if(room.phase==="lobby"){
    return (<div className="min-h-screen bg-gradient-to-b from-[#CE3320] to-[#AE2817] text-white flex flex-col items-center justify-center px-8 py-8">
      <div className="font-hand text-[#E7C96B] text-2xl">Christmas Day</div>
      <div className="font-display font-extrabold text-6xl mb-8 text-center">The Argos Game</div>
      <div className="flex flex-col sm:flex-row items-center gap-10">
        <div className="text-center"><div className="text-white/60 uppercase tracking-widest font-bold mb-3">Scan to join</div><QR text={joinUrl} size={240}/></div>
        <div className="text-center"><div className="text-white/60 uppercase tracking-widest font-bold mb-2">Room code</div><div className="font-display font-extrabold text-8xl tracking-[0.12em] text-[#C9A646] tnum">{code}</div></div>
      </div>
      <div className="mt-10 w-full max-w-3xl"><div className="text-center text-white/60 uppercase tracking-widest font-bold mb-3">In the game ({players.length})</div>
        <div className="flex flex-wrap justify-center gap-3">{players.map(p=>(<div key={p.id} className="flex items-center gap-2 bg-white/10 rounded-full pl-1.5 pr-4 py-1.5"><div className="w-8 h-8 rounded-full grid place-items-center font-bold text-white" style={{background:p.color}}>{(p.name||"?")[0].toUpperCase()}</div><span className="text-lg font-semibold">{p.name}</span></div>))}</div></div>
      <div className="mt-10 text-white/50 text-lg">Waiting for the host to start…</div>
    </div>);
  }
  if(room.phase==="guessing"){
    const nSub=players.filter(p=>(p.submittedRound==null?-1:p.submittedRound)>=room.round).length;
    return (<div className="min-h-screen bg-gradient-to-b from-[#174A2B] to-[#0e3019] text-white flex flex-col items-center justify-center px-8">
      <div className="font-display font-extrabold text-5xl text-[#E7C96B] mb-2">Round {room.round+1} of {ROUNDS}</div>
      <div className="text-2xl text-white/80 mb-10">Everyone's guessing on their phones…</div>
      <div className="font-display font-extrabold text-8xl tnum">{nSub}<span className="text-white/40">/{players.length}</span></div>
      <div className="text-white/60 uppercase tracking-widest font-bold mt-2 text-lg">locked in</div>
      <div className="mt-12 w-full max-w-4xl flex flex-wrap justify-center gap-3">
        {players.map(p=>{const done=(p.submittedRound==null?-1:p.submittedRound)>=room.round; return <div key={p.id} className={"flex items-center gap-2 rounded-full pl-1.5 pr-4 py-1.5 "+(done?"bg-[#C9A646]/25 ring-1 ring-[#C9A646]":"bg-white/10")}><div className="w-8 h-8 rounded-full grid place-items-center font-bold text-white" style={{background:p.color}}>{(p.name||"?")[0].toUpperCase()}</div><span className="text-lg font-semibold">{p.name}</span><span className="text-lg">{done?"✅":"⏳"}</span></div>;})}
      </div>
    </div>);
  }
  if(room.phase==="reveal"){
    const base=room.round*PER_ROUND; const idxs=[]; for(let i=0;i<PER_ROUND;i++){const p=base+i; if(p<room.order.length)idxs.push(p);}
    const rr=roastRound(room,room.round);
    const Card=({code,v,label,name,sub,ring})=>(<div className={"rounded-2xl p-3 flex items-center gap-3 ring-1 "+ring}><div className="w-16 h-16 bg-white rounded-lg p-1 flex items-center justify-center shrink-0">{code?<ArgImg code={code} v={v} size={200} className="max-w-full max-h-full object-contain"/>:<span className="text-2xl">🏆</span>}</div><div><div className="text-xs font-bold uppercase tracking-wide text-[#E7C96B]">{label}</div><div className="font-display font-extrabold text-xl">{name}</div><div className="text-white/70 text-sm">{sub}</div></div></div>);
    return (<div className="min-h-screen bg-gradient-to-b from-[#CE3320] to-[#AE2817] text-white px-6 py-6 overflow-auto no-scrollbar">
      <div className="text-center mb-4"><Trevor size={104} cls="mx-auto"/><div className="font-hand text-[#E7C96B] text-2xl">Trevor's verdict on round {room.round+1}</div></div>
      <div className="max-w-5xl mx-auto flex flex-wrap items-stretch justify-center gap-3 mb-5">
        {rr.best&&<Card code={rr.best.code} v={rr.best.v} label="🎯 Best guess" name={rr.best.name} sub={gbp(rr.best.g)+" vs "+gbp(rr.best.price)} ring="bg-[#174A2B]/50 ring-[#9BE5A0]/40"/>}
        {rr.worst&&<Card code={rr.worst.code} v={rr.worst.v} label="🌋 Wildest miss" name={rr.worst.name} sub={gbp(rr.worst.g)+" vs "+gbp(rr.worst.price)} ring="bg-black/25 ring-white/15"/>}
        {rr.roundWinner&&<Card code={null} label="👑 Round winner" name={rr.roundWinner.name} sub={"+"+rr.roundWinner.rpts+" points"} ring="bg-[#C9A646]/20 ring-[#C9A646]"/>}
      </div>
      <div className="max-w-5xl mx-auto flex flex-col lg:flex-row items-start justify-center gap-6">
        <div className="flex-1 max-w-4xl w-full"><div className="text-center text-white/70 uppercase tracking-widest font-bold mb-3 text-lg">Round {room.round+1} scoresheet</div><ScoreSheet room={room} idxs={idxs} title/></div>
        <div className="w-full lg:w-80 shrink-0"><div className="text-center lg:text-left text-white/70 uppercase tracking-widest font-bold mb-3 text-lg">Standings</div><Leaderboard room={room}/></div>
      </div>
    </div>);
  }
  if(room.phase==="final"){
    const ps=playerList(room).map(p=>({...p,_t:totalFor(room,p.id)})).sort((a,b)=>b._t-a._t); const win=ps[0];
    return (<div className="min-h-screen bg-gradient-to-b from-[#CE3320] to-[#AE2817] text-white flex flex-col items-center px-6 py-8 overflow-auto no-scrollbar">
      <div className="text-6xl mb-1 floaty">🏆</div>
      <div className="text-white/60 uppercase tracking-widest font-bold">Winner</div>
      <div className="font-display font-extrabold text-7xl text-[#C9A646] pop mb-1 text-center">{win?win.name:"—"}</div>
      {win&&<div className="text-2xl mb-6">with {win._t} points</div>}
      <div className="w-full max-w-4xl"><ScoreSheet room={room} title/></div>
      <div className="w-full max-w-3xl"><Awards room={room}/></div>
    </div>);
  }
  return <Center><div className="text-white/70">…</div></Center>;
}

/* ---- root: pick role, subscribe to room ---- */
function App(){
  const params=new URLSearchParams(location.search);
  const isTV = params.get("tv")==="1";
  const [joined,setJoined]=useState(false);
  const [code,setCode]=useState(params.get("code")||"");
  const [room,setRoom]=useState(null);
  const [err,setErr]=useState("");
  const subscribed = (isTV && !!code) || joined;
  useEffect(()=>{ if(!subscribed||!code||!FB_OK) return;
    const ref=roomRef(code); const cb=ref.on("value",s=>setRoom(s.val())); return ()=>ref.off("value",cb);
  },[subscribed,code]);
  const isHost = room && room.host===myId;
  const subKey = playerList(room).map(p=>p.id+":"+(p.submittedRound==null?-1:p.submittedRound)).join(",");
  useEffect(()=>{ if(!isHost||!room||room.phase!=="guessing") return;
    if(allSubmitted(room)){ const t=setTimeout(()=>hostReveal(code,room),500); return ()=>clearTimeout(t); }
  },[isHost,room&&room.phase,room&&room.round,subKey]);
  if(!FB_OK) return <SetupNeeded/>;
  if(isTV){ if(!code) return <TVCodeEntry onCode={setCode}/>; return <TVScreen code={code} room={room}/>; }
  function makePlayer(name){ const color=COLORS[Math.abs([...(name||"x")].reduce((a,ch)=>a+ch.charCodeAt(0),0))%COLORS.length]||COLORS[0]; return {name:name||"Player",color,guesses:{},submittedRound:-1}; }
  function startGame(name){ name=(name||"").trim()||"Host"; const c=randCode(); roomRef(c).set({host:myId,phase:"lobby",round:0,order:shuffledOrder().slice(0,TOTAL_N),players:{[myId]:makePlayer(name)},createdAt:Date.now()}).then(()=>{setCode(c);setJoined(true);}).catch(e=>setErr(String(e))); }
  function joinGame(c,name){ name=(name||"").trim(); roomRef(c).get().then(s=>{ if(!s.exists()){ setErr("No game with code "+c+". Double-check it."); return; } roomRef(c).child("players/"+myId).update(makePlayer(name)).then(()=>{setCode(c);setJoined(true);}); }).catch(e=>setErr(String(e))); }
  if(!joined) return (<div>{err&&<div className="fixed top-3 inset-x-3 z-50 bg-[#8F0A20] text-white text-sm rounded-xl px-4 py-2 text-center shadow-lg">{err}</div>}<Landing onStart={startGame} onJoin={joinGame} prefillCode={code}/></div>);
  return <GameScreen code={code} room={room} isHost={isHost}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
