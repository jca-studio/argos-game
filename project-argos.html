const RATE = 1.34;
const CAST = [
  {id:"you",  name:"You",   color:"#C8102E"},
  {id:"debz", name:"Debz",  color:"#1E5631"},
  {id:"matt", name:"Matt",  color:"#C9A646"},
  {id:"sam",  name:"Sam",   color:"#2B6CB0"},
  {id:"pete", name:"Pete",  color:"#8F0A20"},
];
const ROOM = "7431";
const JOIN_URL = "https://playargos.game/join?room="+ROOM;
const ROUND_SECONDS = 20;

const gbp = n => "£"+(Math.round(n*100)/100).toLocaleString("en-GB",{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});
const pts = (g,a) => Math.max(0, Math.round(100*(1-Math.abs(g-a)/a)));
function botGuess(name, actual){
  let s;
  if(name==="Debz") s = 1+(Math.random()*0.06-0.03);       // ringer
  else if(name==="Sam") s = 2.0+Math.random()*1.6;          // wildly over
  else s = 1+(Math.random()*0.9-0.4);
  return Math.max(1, Math.round(actual*s));
}

/* ---------------- game state hook (mock real-time) ---------------- */
function freshRound(players){
  return players.map(p => ({...p, guess:null, locked:false, rpts:0}));
}
function initGame(){
  return {
    phase:"lobby",            // lobby | guessing | reveal | final
    round:0,
    item:ITEMS[0],
    timer:ROUND_SECONDS,
    players:CAST.map(p=>({...p, total:0, guess:null, locked:false, rpts:0, joined:p.id!=="you"})),
  };
}
function scoreRound(st){
  const item=st.item;
  let best=Infinity;
  st.players.forEach(p=>{ if(p.guess!=null) best=Math.min(best, Math.abs(p.guess-item.price)); });
  const players=st.players.map(p=>{
    if(p.guess==null) return {...p, rpts:0};
    const rp=pts(p.guess,item.price);
    return {...p, rpts:rp, total:p.total+rp, won: Math.abs(p.guess-item.price)===best};
  });
  return {...st, players, phase:"reveal"};
}

function useGame(){
  const [st,setSt] = useState(initGame);

  useEffect(()=>{
    const t=setInterval(()=>{
      setSt(p=>{
        if(p.phase!=="guessing") return p;
        let players=p.players.map(pl=>{
          if(pl.id!=="you" && pl.joined && !pl.locked && Math.random()<0.3)
            return {...pl, locked:true, guess:botGuess(pl.name, p.item.price)};
          return pl;
        });
        const timer=p.timer-1;
        if(timer<=0){
          const locked=players.map(pl=>(pl.id!=="you"&&!pl.locked)?{...pl,locked:true,guess:botGuess(pl.name,p.item.price)}:pl);
          return scoreRound({...p, players:locked, timer:0});
        }
        return {...p, players, timer};
      });
    },1000);
    return ()=>clearInterval(t);
  },[]);

  const api={
    start(){ setSt(p=>({...p, phase:"guessing", round:0, item:ITEMS[0], timer:ROUND_SECONDS, players:freshRound(p.players)})); },
    lockYou(val){ setSt(p=>({...p, players:p.players.map(pl=>pl.id==="you"?{...pl,locked:true,guess:val}:pl)})); },
    joinYou(name){ setSt(p=>({...p, players:p.players.map(pl=>pl.id==="you"?{...pl,joined:true,name:name||"You"}:pl)})); },
    reveal(){ setSt(p=> p.phase==="guessing" ? scoreRound({...p, players:p.players.map(pl=>(pl.id!=="you"&&!pl.locked)?{...pl,locked:true,guess:botGuess(pl.name,p.item.price)}:pl)}) : p ); },
    next(){ setSt(p=>{
      const r=p.round+1;
      if(r>=ITEMS.length) return {...p, phase:"final"};
      return {...p, round:r, item:ITEMS[r], phase:"guessing", timer:ROUND_SECONDS, players:freshRound(p.players)};
    }); },
    reset(){ setSt(initGame()); },
  };
  return [st, api];
}

const RED="#C8102E", DEEP="#8F0A20", PINE="#174A2B", GOLD="#C9A646", CREAM="#FBF6EC", INK="#1A1410";

function Btn({children,onClick,tone="gold",className="",disabled}){
  const tones={
    gold:"bg-[#C9A646] hover:bg-[#d8b85a] text-[#2a1e05] shadow-[0_3px_0_#9a7d2e]",
    red:"bg-[#C8102E] hover:bg-[#d8233f] text-white shadow-[0_3px_0_#8F0A20]",
    pine:"bg-[#174A2B] hover:bg-[#1c5c35] text-white shadow-[0_3px_0_#0d3019]",
    ghost:"bg-white/10 hover:bg-white/20 text-white ring-1 ring-white/25 shadow-none",
  };
  return <button onClick={onClick} disabled={disabled}
    className={"font-bold rounded-xl px-4 py-2.5 transition active:translate-y-[2px] active:shadow-none disabled:opacity-40 disabled:cursor-not-allowed "+tones[tone]+" "+className}>{children}</button>;
}

function QR({text,size=150,light}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!window.qrcode||!ref.current) return;
    try{
      const qr=window.qrcode(0,"M"); qr.addData(text); qr.make();
      ref.current.innerHTML=qr.createSvgTag({cellSize:5,margin:1});
      const svg=ref.current.querySelector("svg");
      if(svg){ svg.removeAttribute("width"); svg.removeAttribute("height"); svg.setAttribute("preserveAspectRatio","xMidYMid meet"); svg.style.width="100%"; svg.style.height="100%"; svg.style.display="block"; }
    }catch(e){}
  },[text]);
  return <div className={(light?"bg-white":"bg-white")+" rounded-xl p-2 shadow-lg"} style={{width:size,height:size}}><div ref={ref} style={{width:"100%",height:"100%"}}/></div>;
}

function ItemPhoto({item,reveal,size="h-48"}){

    <div className="relative inline-block">

          : <div className="text-5xl">🏷️</div>}

      {/* Sharpie-redacted price tag */}
      <div className="absolute -bottom-3 -right-3 rotate-[-6deg]">
        <div className="bg-[#FBF6EC] rounded-md px-3 py-1.5 shadow-md ring-1 ring-black/10 flex items-center gap-1">
          <span className="font-display font-bold text-[#1A1410] text-lg">£</span>
          {reveal
            ? <span className="font-display font-extrabold text-[#C8102E] text-xl pop tnum">{(Math.round(item.price*100)/100).toLocaleString("en-GB")}</span>
            : <span className="relative inline-block">
                <span className="opacity-0 font-display font-extrabold text-xl">888</span>
                <span className="absolute inset-0 -mx-1 rounded-sm bg-[#15110c]" style={{boxShadow:"0 0 0 2px #15110c", clipPath:"polygon(0 12%,100% 0,100% 88%,0 100%)"}}/>

        </div>

  );

function Leaderboard({players, highlightYou=true, compact}){
  const sorted=[...players].filter(p=>p.joined!==false).sort((a,b)=>b.total-a.total);
  return (
    <div className="space-y-2">
      {sorted.map((p,i)=>(
        <div key={p.id} className={"flex items-center gap-3 rounded-xl px-3 "+(compact?"py-1.5":"py-2.5")+" transition "+
          (i===0?"bg-[#C9A646]/20 ring-1 ring-[#C9A646]":"bg-white/8 ")+
          (highlightYou&&p.id==="you"?" ring-1 ring-white/50":"")}>
          <div className={"font-display font-bold tnum "+(compact?"text-base w-5":"text-xl w-6")+" "+(i===0?"text-[#C9A646]":"text-white/50")}>{i+1}</div>
          <div className="w-7 h-7 rounded-full grid place-items-center text-white text-xs font-bold shrink-0" style={{background:p.color}}>{p.name[0]}</div>
          <div className="flex-1 font-semibold text-white truncate">{p.name}{p.id==="you"&&<span className="text-white/50 font-normal"> · you</span>}</div>
          {p.locked && p.rpts>0 && <span className="text-[#9BE5A0] text-xs font-bold tnum">+{p.rpts}</span>}
          <div className={"font-display font-extrabold tnum "+(compact?"text-base":"text-xl")+" "+(i===0?"text-[#C9A646]":"text-white")}>{p.total}</div>
        </div>
      ))}
    </div>
  );
}

function RosterLive({players}){

function TimerRing({timer,total=ROUND_SECONDS,size=120}){
  const r=size/2-8, c=2*Math.PI*r, frac=Math.max(0,timer/total);
  const danger=timer<=5;
  return (
    <div className="relative grid place-items-center" style={{width:size,height:size}}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,.15)" strokeWidth="8" fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={danger?"#C8102E":"#C9A646"} strokeWidth="8" fill="none"
          strokeDasharray={c} strokeDashoffset={c*(1-frac)} strokeLinecap="round" style={{transition:"stroke-dashoffset 1s linear"}}/>
      </svg>
      <div className={"absolute font-display font-extrabold tnum "+(danger?"text-[#ff6b6b]":"text-white")} style={{fontSize:size*0.34}}>{timer}</div>
    </div>
  );
}

/* ---------------- Scratch-off bonus card ---------------- */
function ScratchCard({prize}){
  const cv=useRef(null); const [done,setDone]=useState(false);
  useEffect(()=>{
    const c=cv.current; if(!c) return; const ctx=c.getContext("2d");
    const g=ctx.createLinearGradient(0,0,c.width,c.height);
    g.addColorStop(0,"#C9A646"); g.addColorStop(1,"#E7C96B");
    ctx.fillStyle=g; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle="rgba(90,60,0,.55)"; ctx.font="bold 15px Hanken Grotesk"; ctx.textAlign="center";
    ctx.fillText("✦ SCRATCH TO REVEAL ✦", c.width/2, c.height/2+5);
    let drawing=false, finished=false;
    const P=e=>{const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*(c.width/r.width), y:(t.clientY-r.top)*(c.height/r.height)};};
    const check=()=>{ const d=ctx.getImageData(0,0,c.width,c.height).data; let clear=0,n=0; for(let i=3;i<d.length;i+=40){n++; if(d[i]<40)clear++;} if(!finished && clear/n>0.45){finished=true; setDone(true);} };
    const scratch=e=>{ if(!drawing)return; const p=P(e); ctx.globalCompositeOperation="destination-out"; ctx.beginPath(); ctx.arc(p.x,p.y,16,0,7); ctx.fill(); check(); };
    const down=e=>{drawing=true; scratch(e);}; const up=()=>{drawing=false;};
    c.addEventListener("mousedown",down); c.addEventListener("mousemove",scratch); window.addEventListener("mouseup",up);
    c.addEventListener("touchstart",e=>{e.preventDefault();down(e);},{passive:false});
    c.addEventListener("touchmove",e=>{e.preventDefault();scratch(e);},{passive:false});
    window.addEventListener("touchend",up);
    return ()=>{window.removeEventListener("mouseup",up); window.removeEventListener("touchend",up);};
  },[]);
  return (
    <div className="relative rounded-xl overflow-hidden ring-1 ring-black/10 select-none" style={{width:"100%",maxWidth:300,height:120}}>
      <div className="absolute inset-0 grid place-items-center bg-gradient-to-br from-[#174A2B] to-[#0e3019] text-center px-4">
        <div>
          <div className="text-[#E7C96B] text-xs font-bold uppercase tracking-wider">Bonus</div>
          <div className="text-white font-display font-extrabold text-xl leading-tight">{prize}</div>
        </div>
      </div>
      <canvas ref={cv} width={300} height={120}
        className={"absolute inset-0 w-full h-full cursor-pointer transition-opacity duration-500 "+(done?"opacity-0 pointer-events-none":"opacity-100")}/>
    </div>
  );
}

function Keypad({val,setVal}){
  const push=d=>{ const s=(String(val)==="0"?"":String(val))+d; setVal(Math.min(999999, +s)); };

  const keys=["1","2","3","4","5","6","7","8","9","0"];
  return (
    <div className="grid grid-cols-3 gap-2 w-full">
      {keys.slice(0,9).map(k=><button key={k} onClick={()=>push(k)} className="bg-white rounded-xl py-3 font-display font-bold text-xl shadow ring-1 ring-black/5 active:translate-y-[1px]">{k}</button>)}
      <button onClick={()=>setVal(0)} className="bg-white rounded-xl py-3 font-bold text-sm shadow ring-1 ring-black/5 text-[#8a7a5f]">C</button>
      <button onClick={()=>push("0")} className="bg-white rounded-xl py-3 font-display font-bold text-xl shadow ring-1 ring-black/5">0</button>
      <button onClick={back} className="bg-white rounded-xl py-3 font-bold text-xl shadow ring-1 ring-black/5">⌫</button>
    </div>
  );
}
function bonusFor(round){
  const b=["Double points next round!","+50 bonus points","Steal 20 pts from the leader","Immunity: keep your worst score","+100 if you're last right now"];
  return b[round % b.length];
}

                {st.phase==="guessing"
                  ? (p.locked?<span className="text-xs font-bold text-[#174A2B]">✓ {gbp(p.guess)}</span>:<span className="text-xs text-[#9a7d2e] animate-pulse">typing…</span>)
                  : <span className="text-sm tnum"><b>{p.total}</b> <span className="text-[#9BE5A0]">+{p.rpts}</span></span>}
              </div>
            ))}
          </div>
        </div>
        {/* controls + leaderboard */}
        <div className="flex flex-col gap-5 min-h-0">
          <div className="bg-white rounded-2xl p-5 ring-1 ring-black/5">
            <div className="font-display font-bold text-lg mb-3">Game controls</div>
            <div className="grid grid-cols-2 gap-2">
              <Btn tone="pine" onClick={api.start}>▶ Start</Btn>
              <Btn tone="red" onClick={api.reveal} disabled={st.phase!=="guessing"}>Reveal</Btn>
              <Btn tone="gold" onClick={api.next} disabled={st.phase!=="reveal"}>Next item</Btn>
              <Btn tone="ghost" className="!text-[#1A1410] !ring-black/15" onClick={api.reset}>↺ Reset</Btn>
            </div>
          </div>
          <div className="bg-gradient-to-b from-[#8F0A20] to-[#5e0716] rounded-2xl p-5 flex-1 flex flex-col min-h-0">
            <div className="font-display font-bold text-lg text-white mb-3">Live leaderboard</div>
            <div className="overflow-auto no-scrollbar flex-1"><Leaderboard players={st.players} compact/></div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------- preview shell + device frames ---------------- */
function DeviceFrame({device,children}){
  if(device==="tv") return (
    <div className="w-full max-w-[1120px]">
      <div className="bg-[#111] rounded-2xl p-3 shadow-2xl">
        <div className="rounded-lg overflow-hidden aspect-video bg-black">{children}</div>
      </div>
      <div className="mx-auto mt-0 w-32 h-3 bg-[#111] rounded-b-xl"/>
      <div className="mx-auto w-44 h-2 bg-[#0a0a0a] rounded-full"/>
      <div className="text-center text-xs text-[#8a7a5f] mt-2 font-semibold">Smart TV / big screen · ≥1280px</div>
    </div>
  );
  if(device==="phone") return (
    <div className="text-center">
      <div className="w-[378px] h-[760px] bg-black rounded-[2.6rem] p-3 shadow-2xl mx-auto">
        <div className="relative w-full h-full rounded-[2rem] overflow-hidden bg-white">
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-28 h-5 bg-black rounded-b-2xl z-20"/>
          {children}
        </div>
      </div>
      <div className="text-xs text-[#8a7a5f] mt-2 font-semibold">Phone gamepad · ≤640px</div>
    </div>
  );
  if(device==="ipad") return (
    <div className="text-center">
      <div className="w-full max-w-[900px] bg-black rounded-[1.6rem] p-3 shadow-2xl mx-auto">
        <div className="rounded-xl overflow-hidden bg-white" style={{height:660}}>{children}</div>
      </div>
      <div className="text-xs text-[#8a7a5f] mt-2 font-semibold">iPad / tablet · 641–1024px · host or player</div>
    </div>
  );
  return (
    <div className="w-full max-w-[1120px]">
      <div className="bg-[#2a2a2a] rounded-t-xl px-4 py-2 flex items-center gap-2">
        <span className="w-3 h-3 rounded-full bg-[#ff5f57]"/><span className="w-3 h-3 rounded-full bg-[#febc2e]"/><span className="w-3 h-3 rounded-full bg-[#28c840]"/>
        <div className="ml-3 flex-1 bg-[#444] rounded px-3 py-1 text-xs text-white/60">playargos.game/admin</div>
      </div>
      <div className="rounded-b-xl overflow-hidden shadow-2xl bg-white" style={{height:680}}>{children}</div>
      <div className="text-center text-xs text-[#8a7a5f] mt-2 font-semibold">Desktop / laptop · spectator + admin</div>
    </div>
  );
}

function App(){
  const [st,api]=useGame();
  const [device,setDevice]=useState("tv");
  const tabs=[["tv","📺","TV"],["phone","📱","Phone"],["ipad","📲","iPad"],["desktop","💻","Desktop"]];
  return (
    <div className="min-h-screen bg-[#ECE3D4] text-[#1A1410]">
      {/* top preview bar */}
      <div className="sticky top-0 z-30 bg-[#8F0A20] text-white shadow-lg">
        <div className="max-w-[1200px] mx-auto px-4 py-2.5 flex items-center gap-3 flex-wrap">
          <div className="font-display font-extrabold text-lg mr-2">Project Argos <span className="text-[#E7C96B] font-sans font-semibold text-xs align-middle">preview</span></div>
          <div className="flex gap-1 bg-black/20 rounded-full p-1">
            {tabs.map(([k,ic,lbl])=>(
              <button key={k} onClick={()=>setDevice(k)} className={"px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5 transition "+(device===k?"bg-[#C9A646] text-[#2a1e05]":"text-white/80 hover:text-white")}>
                <span>{ic}</span><span className="hidden sm:inline">{lbl}</span>
              </button>
            ))}
          </div>
          <div className="flex-1"/>
          {/* demo drive controls */}
          <div className="flex items-center gap-2">
            <span className="text-xs font-bold text-white/60 capitalize hidden md:inline">{st.phase==="guessing"?`⏱ ${st.timer}s`:st.phase}</span>
            <Btn tone="pine" className="!py-1.5 !px-3 text-sm" onClick={api.start}>▶ Start</Btn>
            <Btn tone="red" className="!py-1.5 !px-3 text-sm" onClick={api.reveal} disabled={st.phase!=="guessing"}>Reveal</Btn>
            <Btn tone="gold" className="!py-1.5 !px-3 text-sm" onClick={api.next} disabled={st.phase!=="reveal"}>Next</Btn>
            <Btn tone="ghost" className="!py-1.5 !px-3 text-sm" onClick={api.reset}>↺</Btn>
          </div>
        </div>
      </div>

      <div className="max-w-[1200px] mx-auto px-4 py-6 flex flex-col items-center">
        <p className="text-[#6b5e45] text-sm mb-5 text-center max-w-2xl">
          One codebase, four device contexts. Use the tabs to preview each. The <b>demo controls</b> above drive a shared live game — start a round, watch guesses lock in across every view, reveal the price, and advance. In production these views switch automatically by screen size.
        </p>
        <DeviceFrame device={device}><ViewFor device={device} st={st} api={api}/></DeviceFrame>
      </div>
    </div>
  );
}
function ViewFor({device,st,api}){
  if(device==="tv") return <TVView st={st} api={api}/>;
  if(device==="phone") return <PhoneView st={st} api={api}/>;
  if(device==="ipad") return <TabletView st={st} api={api}/>;
  return <DesktopView st={st} api={api}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
